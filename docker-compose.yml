services:
  mcp-searxng:
    image: isokoliuk/mcp-searxng:latest
    ports:
      - "${MCP_PORT:-3001}:${MCP_HTTP_PORT:-3001}"
    env_file: .env
    environment:
      - MCP_HTTP_PORT=${MCP_HTTP_PORT:-3001}
      - MCP_HTTP_HOST=0.0.0.0
      - SEARXNG_URL=${SEARXNG_URL:-http://localhost:8080}
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/zscaler-root-ca.pem
      - NODE_SKIP_SYSTEM_CA=1
    volumes:
      - /Users/Brodie.Balser/.ssl/zscaler-root-ca.pem:/etc/ssl/certs/zscaler-root-ca.pem:ro
    restart: unless-stopped